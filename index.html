    octx.beginPath(); octx.arc(0, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.001, o.prog)); octx.stroke();
  }
  octx.font = '18px ' + EMO; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000'; octx.fillText(e, 0, cy + 1);
  octx.globalAlpha = 1;
}
function drawOverlay() {
  octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, cw, ch);
  for (const k of cooks) if (k.order && k.t > 0) at(k.x, k.y, 1.95, () => bubble(k.order.item.e, { prog: 1 - k.t / k.total }));
  if (BAR.cur && BAR.t > 0) at(8.1, 0.6, 1.6, () => bubble(BAR.cur.item.e, { prog: 1 - BAR.t / BAR.total }));
  for (const c of customers) if (c.state === 'wait') {
    const r = c.pat / c.patMax, st = c.order.state;
    at(c.x, c.y, c.vip ? 1.9 : 1.75, () => bubble(c.item.e, { prog: r, col: r > 0.5 ? '#3fb950' : r > 0.25 ? '#f4a300' : '#e5383b',
      bg: st === 'ready' ? '#e6ffe6' : '#fff', dim: st === 'carry' }));
  }
  for (const t of tables) {
    for (const s of t.seats) if (s.state === 'dirty' && !s.claimed) at(s.x, s.y, 1.15 + Math.sin(time * 4) * 0.04, () => bubble('🧽'));
    if (t.cash > 0) at(t.x, t.y, 1.0, () => label('💰' + fmt(t.cash), 0, 14, '#fff', '#1d6b2c'));
  }
  if (player.stack.some(it => !it.o)) at(SINK.x, 0.6, 1.3 + Math.sin(time * 5) * 0.05, () => bubble('🚰', { bg: '#e0f4ff' }));
  if (S.tables < SPOTS.length) {
    const [x, y] = SPOTS[S.tables], ok = S.money >= TABLE_COST[S.tables];
    at(x, y, 0.05, () => { label(T('addTable'), -9, 14, ok ? '#d8ffd8' : '#eee'); label('💰' + fmt(TABLE_COST[S.tables]), 9, 14, ok ? '#fff' : '#ffb4a8');
      if (padT > 0) { octx.strokeStyle = '#fff'; octx.lineWidth = 5; octx.beginPath(); octx.arc(0, -40, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * padT / 0.8); octx.stroke(); } });
  }
  if (player.stack.length) at(player.x, player.y, 2.05, () => label(player.stack.length + '/' + capacity(), 0, 12, player.stack.length >= capacity() ? '#ffb4a8' : '#fff'));
  for (const f of floats) at(f.x, f.y, f.z + f.t * 0.7, () => { octx.globalAlpha = Math.max(0, 1 - f.t / 1.3); label(f.text, 0, 16, f.color); });
  if (joy.on && joy.moved) {
    octx.globalAlpha = 0.35; octx.fillStyle = '#fff'; octx.beginPath(); octx.arc(joy.sx, joy.sy, 46, 0, 7); octx.fill();
    octx.globalAlpha = 0.8; octx.beginPath(); octx.arc(joy.sx + joy.dx * 46, joy.sy + joy.dy * 46, 20, 0, 7); octx.fill(); octx.globalAlpha = 1;
  }
}

function drawOverlayExtra(dt) {
  const BADGE = { critic: '📝', hurry: '⚡', rider: '🛵' };
  for (const c of customers) if (c.state === 'wait' && BADGE[c.kind]) at(c.x, c.y, 1.75, () => { octx.font = '15px ' + EMO; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillStyle = '#000'; octx.fillText(BADGE[c.kind], 19, -42); });
  if (STAND.cash > 0) at(STAND.x, STAND.y, 1.15, () => label('💰' + fmt(STAND.cash), 0, 14, '#fff', '#1d6b2c'));
  if (mouse) at(mouse.x, mouse.y, 0.45, () => bubble('🐭', { prog: Math.max(0, mouse.t / 14), col: '#e5383b', bg: '#fff0f0' }));
  for (const c of coins) {
    c.t += dt; if (c.t < 0) continue;
    const k = Math.min(1, c.t / 0.55), e = k * k, x = c.x + (cw - 70 - c.x) * e, y = c.y + (34 - c.y) * e - Math.sin(k * Math.PI) * 46;
    octx.fillStyle = '#ffc93c'; octx.strokeStyle = '#b8860b'; octx.lineWidth = 2; octx.beginPath(); octx.arc(x, y, 7 * K, 0, 7); octx.fill(); octx.stroke();
    octx.fillStyle = '#fff6c9'; octx.beginPath(); octx.arc(x - 2 * K, y - 2 * K, 2.2 * K, 0, 7); octx.fill();
  }
  coins = coins.filter(c => c.t < 0.55);
}

// ================= 输入 =================
function setTarget(x, y) {   // 目标点若落在桌子范围内，挪到最近的桌边
  for (const t of tables) {
    const dx = x - t.x, dy = y - t.y;
    if (Math.abs(dx) < 1.36 && Math.abs(dy) < 0.72) { if (1.36 - Math.abs(dx) < 0.72 - Math.abs(dy)) x = t.x + Math.sign(dx || 1) * 1.38; else y = t.y + Math.sign(dy || 1) * 0.74; }
  }
  player.target = { x, y };
}
function floorAt(px, py) {
  const o = new THREE.Vector3(px / cw * 2 - 1, 1 - py / ch * 2, -1).unproject(cam), d = cam.getWorldDirection(new THREE.Vector3());
  const t = -o.y / d.y; return { x: o.x + d.x * t, y: o.z + d.z * t };
}
glc.addEventListener('pointerdown', e => { try { glc.setPointerCapture(e.pointerId); } catch (_) {} Object.assign(joy, { on: true, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0, moved: false, t0: performance.now() }); });
glc.addEventListener('pointermove', e => {
  if (!joy.on) return;
  let dx = e.clientX - joy.sx, dy = e.clientY - joy.sy; const l = Math.hypot(dx, dy);
  if (l > 8) joy.moved = true;
  if (l > 46) { dx *= 46 / l; dy *= 46 / l; }
  joy.dx = dx / 46; joy.dy = dy / 46;
});
const endJoy = e => {
  if (!joy.on) return; joy.on = false;
  if (!joy.moved && performance.now() - joy.t0 < 400) { const f = floorAt(e.clientX, e.clientY); setTarget(f.x, f.y); }
};
glc.addEventListener('pointerup', endJoy); glc.addEventListener('pointercancel', () => { joy.on = false; });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; }); addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ================= HUD =================
const $ = id => document.getElementById(id);
let toastTimer = 0, hintHidden = false;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 2600); }
function hideHint() { if (!hintHidden) { hintHidden = true; setTimeout(() => $('hint').style.opacity = 0, 6000); } }
const canBuyAny = () => Object.keys(UP).some(k => S.up[k] < UP[k].cost.length && S.money >= UP[k].cost[S.up[k]]);
function renderHud() {
  $('money').textContent = '💰 ' + fmt(S.money);
  $('rating').textContent = '⭐ ' + T('rating') + ' ' + S.rating.toFixed(1);
  $('star').textContent = S.level;
  $('combo').style.display = combo >= 2 ? 'block' : 'none'; $('combo').textContent = '🔥 ×' + comboMul().toFixed(2) + '  (' + combo + ')';
  $('xpBar').style.width = (S.xp / xpNeed() * 100) + '%'; $('xpText').textContent = S.xp + '/' + xpNeed();
  const m = S.mission;
  if (m) {
    $('mText').innerHTML = '📋 ' + T('m_' + m.type, { n: fmt(m.goal) }) + ' <b>' + fmt(Math.min(m.prog, m.goal)) + '/' + fmt(m.goal) + '</b><br>' + T('reward', { n: fmt(m.reward) });
    $('mBar').style.width = Math.min(100, m.prog / m.goal * 100) + '%';
  }
  $('upDot').style.display = canBuyAny() ? 'block' : 'none';
  if ($('panel').classList.contains('open')) renderPanel();
}
function renderPanel() {
  const list = $('list'), sc = list.scrollTop; list.innerHTML = '';
  for (const k of Object.keys(UP)) {
    const u = UP[k], lv = S.up[k], max = u.cost.length, full = lv >= max;
    const row = document.createElement('div'); row.className = 'row';
    const [nm, ds0] = T(k === 'tip' ? 'tipUp' : k); let ds = ds0;
    if (k === 'menu' && !full) ds = T('unlock', { e: DISHES[lv + 1].e, n: T(DISHES[lv + 1].m), p: DISHES[lv + 1].p });
    if (k === 'bar') ds = full ? T('barFull') : T(lv ? 'barNew' : 'barOpen', { e: DRINKS[lv].e, n: T(DRINKS[lv].m), p: DRINKS[lv].p });
    row.innerHTML = '<div class="ic">' + u.ic + '</div><div class="tx"><div class="nm">' + nm +
      ' <span style="color:#c08a3e;font-size:12px">Lv.' + lv + '/' + max + '</span></div><div class="ds">' + ds + '</div></div>';
    const b = document.createElement('button');
    b.textContent = full ? T('max') : '💰' + fmt(u.cost[lv]); b.disabled = full || S.money < u.cost[lv];
    b.onclick = () => { if (S.money < u.cost[lv]) return; addMoney(-u.cost[lv]); S.up[k]++; syncStaff(); save(); renderHud(); sfx('buy'); };
    row.appendChild(b); list.appendChild(row);
  }
  list.scrollTop = sc;
}
$('upBtn').onclick = () => { $('panel').classList.add('open'); renderPanel(); };
$('close').onclick = () => $('panel').classList.remove('open');
$('panel').onclick = e => { if (e.target === $('panel')) $('panel').classList.remove('open'); };
$('reset').onclick = () => { if (confirm(T('resetAsk'))) { S = fresh(); init(); save(); hudDirty = true; $('panel').classList.remove('open'); } };

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang; document.title = T('title');
  $('langBtn').textContent = '🌐 ' + LANGS[lang]; $('upTxt').textContent = T('upgrade');
  $('hint').innerHTML = T('hint1') + '<br>' + T('hint2'); $('rush').textContent = T('rush');
  $('panelTitle').textContent = T('panel'); $('reset').textContent = T('reset');
  drawMenu(); drawSign(); hudDirty = true;
}
$('sndBtn').textContent = AU.on ? '🔊' : '🔇';
$('sndBtn').onclick = () => {
  AU.on = !AU.on; $('sndBtn').textContent = AU.on ? '🔊' : '🔇'; if (AU.master) AU.master.gain.value = AU.on ? 1 : 0;
  try { localStorage.setItem('shiguang-snd', AU.on ? '1' : '0'); } catch (e) {}
};
$('langBtn').onclick = () => {
  const ks = Object.keys(LANGS); lang = ks[(ks.indexOf(lang) + 1) % ks.length];
  try { localStorage.setItem('shiguang-lang', lang); } catch (e) {}
  applyLang();
};
// ================= 主循环 =================
init(); applyLang();
if (S.last && S.up.waiter > 0) {   // 离线收入
  const sec = Math.min(7200, (Date.now() - S.last) / 1000);
  if (sec > 120) { const n = Math.round(sec * S.up.waiter * (6 + 6 * S.up.menu) * (1 + 0.2 * S.up.tip) * 0.025); S.money += n; hudDirty = true; setTimeout(() => toast(T('offline', { n: fmt(n) })), 900); }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); sync3D(dt); renderer.render(scene, cam); drawOverlay(); drawOverlayExtra(dt);
  if (hudDirty) { hudDirty = false; renderHud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(save, 5000); addEventListener('pagehide', save);
window.__game = { setTarget, get S() { return S; }, player, get tables() { return tables; }, get customers() { return customers; }, KIT, BAR, SINK, STAND, buff, get pups() { return pups; }, get mouse() { return mouse; }, get combo() { return combo; }, step: update };
})();
</script>
