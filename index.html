      c.tx = x[1]; c.ty = x[2]; c.dir = x[3]; c.moving = !!(x[4] & 1); const hb = !!(x[4] & 2); if (hb !== !!c.hb) { c.hb = hb; c.stack = hb ? [{ m: b.k === 'teashop' ? 'tea' : 'basket' }] : []; c.stackDirty = true; } c.mesh.visible = !(x[4] & 4); }

function netMsg(topic, payload) {

function netTick(dt) {   // 每帧调用：定时发送

let fno = 0, pfT = 0, pfN = 0, pfBad = 0;
function setQuality(q, auto) {

  sun.castShadow = quality > 0; fit(); $('qBtn').textContent = T('gfx', { n: T('q' + quality) });
  if (auto) toast(TK('gfxAuto', { n: TK('q' + quality) }));

function perfTick(dt) {   // 连续 8 秒平均不到 22 帧就降一档画质（切到后台等长时间停顿不算）

  pfT += dt; pfN++;

  prof(n = 20) { const t0 = performance.now(); for (let i = 0; i < n; i++) sync3D(0.016); const t1 = performance.now(); for (let i = 0; i < n; i++) { renderer.shadowMap.needsUpdate = quality > 0; renderer.render(scene, cam); } renderer.getContext().finish(); const t2 = performance.now(); return { syncMs: +((t1 - t0) / n).toFixed(2), renderMs: +((t2 - t1) / n).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; } };
