function update(dt) {

  else if (S.level >= 2) { nextRush -= dt; if (nextRush <= 0) { rushT = 22; document.getElementById('rush').style.display = 'block'; } }

  u.legs[0].rotation.x = sit ? -1.5 : sw * 0.75; u.legs[1].rotation.x = sit ? -1.5 : -sw * 0.75;
  const cooking = p.order && p.t > 0 && !p.state, eating = p.state === 'eat';

init(); applyLang();
if (S.last) {   // 离开期间产业继续营业，收入存在店里等你去收
  const sec = (Date.now() - S.last) / 1000; let n = 0;
  if (sec > 60) for (const b of BIZ) { const s = S.biz[b.k]; if (s.lv > 0) { const add = Math.min(bizCap(b) - s.cash, bizRate(b) * sec); if (add > 0) { s.cash += add; n += add; } } }
  if (n >= 1) setTimeout(() => toast(T('offline', { n: fmt(n) })), 900);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); sync3D(dt); renderer.render(scene, cam); drawOverlay(dt);
  if (hudDirty) { hudDirty = false; renderHud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(save, 5000); addEventListener('pagehide', save);
window.__game = { get S() { return S; }, player, get tables() { return tables; }, get customers() { return customers; }, get ST() { return ST; }, get workers() { return workers; },
  SINK, STAND, FRIDGE, BIZ, PADY, choreSpots, buff, get pups() { return pups; }, get mouse() { return mouse; }, get combo() { return combo; }, step: update, setTarget, addXp, unitCost, stockCap };
})();
</script>
